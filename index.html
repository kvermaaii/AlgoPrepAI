<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AlgoPrepAI Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)', panel: 'var(--panel)', panel2: 'var(--panel-2)',
          line: 'var(--line)', line2: 'var(--line-2)',
          fg: 'var(--fg)', muted: 'var(--muted)', dim: 'var(--dim)',
          accent: 'var(--accent)', accentink: 'var(--accent-ink)', accentsoft: 'var(--accent-soft)',
          ok: 'var(--ok)', oksoft: 'var(--ok-soft)', bad: 'var(--bad)', badsoft: 'var(--bad-soft)'
        },
        fontFamily: {
          display: ['"Bricolage Grotesque"', 'IBM Plex Sans', 'system-ui', 'sans-serif'],
          sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'Menlo', 'Consolas', 'monospace']
        }
      }
    }
  };
</script>
<style>
  /* Layout: full-height IDE shell. Header, pacing strip, then two panels (problem + interviewer chat | editor + console). Stacks on narrow screens. */
  :root {
    --bg: #0e1116;
    --panel: #151922;
    --panel-2: #1b212c;
    --line: #262d3a;
    --line-2: #343d4e;
    --fg: #e7eaf0;
    --muted: #8d96a8;
    --dim: #5f697b;
    --accent: #f2a93b;
    --accent-ink: #1a1204;
    --accent-soft: rgba(242, 169, 59, 0.13);
    --ok: #4cc38a;
    --ok-soft: rgba(76, 195, 138, 0.13);
    --bad: #f27474;
    --bad-soft: rgba(242, 116, 116, 0.13);
    --tk-kw: #6cb0f5;
    --tk-str: #d9a07a;
    --tk-com: #6f8f66;
    --tk-num: #b6cfa3;
    --tk-fn: #e3d38f;
    --tk-ty: #56c5b0;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: rgba(242, 169, 59, 0.28); }
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }

  .tk-kw { color: var(--tk-kw); }
  .tk-str { color: var(--tk-str); }
  .tk-com { color: var(--tk-com); font-style: italic; }
  .tk-num { color: var(--tk-num); }
  .tk-fn { color: var(--tk-fn); }
  .tk-ty { color: var(--tk-ty); }

  .code-layer {
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 22px;
    padding: 12px 16px 56px;
    white-space: pre;
    tab-size: 4;
    letter-spacing: 0;
    margin: 0;
    border: 0;
  }
  .code-input {
    background: transparent;
    color: transparent;
    caret-color: var(--accent);
    resize: none;
    outline: none;
    overflow: auto;
  }
  .gutter-line { height: 22px; line-height: 22px; }

  .prose-p { line-height: 1.65; color: #c9cfdb; }
  .ex-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }

  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: blink 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    .live-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(76,195,138,0.5); } 70% { box-shadow: 0 0 0 6px rgba(76,195,138,0); } 100% { box-shadow: 0 0 0 0 rgba(76,195,138,0); } }
  }
  select { color-scheme: dark; }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
  const { useState, useEffect, useRef } = React;
  const html = htm.bind(React.createElement);

  /* ---------- Data ---------- */
  const TOTAL = 45 * 60;
  const PHASES = [
    { name: 'Approach', min: 5 },
    { name: 'Code', min: 25 },
    { name: 'Test', min: 10 },
    { name: 'Review', min: 5 },
  ];

  const STARTER = {
    python: [
      'class Solution:',
      '    def twoSum(self, nums: list[int], target: int) -> list[int]:',
      '        # Write your solution here',
      '        pass',
      '',
    ].join('\n'),
    cpp: [
      'class Solution {',
      'public:',
      '    vector<int> twoSum(vector<int>& nums, int target) {',
      '        // Write your solution here',
      '        ',
      '    }',
      '};',
      '',
    ].join('\n'),
    java: [
      'class Solution {',
      '    public int[] twoSum(int[] nums, int target) {',
      '        // Write your solution here',
      '        return new int[]{};',
      '    }',
      '}',
      '',
    ].join('\n'),
  };
  const FILE = { python: 'solution.py', cpp: 'solution.cpp', java: 'Solution.java' };

  const CASES = [
    { nums: '[2,7,11,15]', target: '9', expected: '[0,1]' },
    { nums: '[3,2,4]', target: '6', expected: '[1,2]' },
    { nums: '[3,3]', target: '6', expected: '[0,1]' },
  ];

  const HINTS = [
    'Think about what you need at each element. If the current number is x, which value would complete the pair?',
    'Looking up that complement should not need another pass over the array. Which data structure gives constant-time lookups?',
    'Store each value with its index as you go. Before inserting the current number, check whether its complement is already stored.',
  ];
  const FOLLOWUPS = [
    'Makes sense. What are the time and space complexity of that approach?',
    'Good. Suppose the array were sorted. Could you avoid the extra memory?',
    'Trace [3, 3] with target 6 through your code by hand. What does it return?',
    'Clear explanation. Start coding whenever you are ready, and keep talking me through it.',
  ];
  const SEED = [
    { id: 1, role: 'ai', text: 'Hi, I am Aria, your interviewer for this round. You have 45 minutes. Read the problem, then walk me through your approach before you write any code.' },
    { id: 2, role: 'me', text: 'Brute force checks every pair, which is O(n²). I think a hash map can bring it down to a single pass.' },
    { id: 3, role: 'ai', text: 'Good start. What would you store in the map, and what happens if the same value appears twice?' },
  ];

  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  /* ---------- Syntax highlighting ---------- */
  const KEYWORDS = {
    python: 'class def return if elif else for while in not and or is None True False import from pass self continue break lambda with as try except raise range enumerate len',
    cpp: 'class public private return if else for while auto const new delete true false nullptr using namespace struct template typename continue break static',
    java: 'class public private protected return if else for while new true false null static final import package continue break this',
  };
  const KW = {};
  Object.keys(KEYWORDS).forEach((k) => { KW[k] = new Set(KEYWORDS[k].split(' ')); });
  const TYPES = new Set('int long double float bool boolean char void string vector unordered_map map unordered_set set pair List Map HashMap Set HashSet Integer String list dict'.split(' '));

  const TAIL = String.raw`|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])`;
  const RE_SRC = {
    python: String.raw`(#.*)` + TAIL,
    cpp: String.raw`(\/\/.*)` + TAIL,
    java: String.raw`(\/\/.*)` + TAIL,
  };

  function highlight(code, lang) {
    const re = new RegExp(RE_SRC[lang], 'g');
    const out = [];
    let plain = '';
    let key = 0;
    const flush = () => { if (plain) { out.push(plain); plain = ''; } };
    const push = (cls, text) => { flush(); out.push(React.createElement('span', { key: key++, className: cls }, text)); };
    for (const m of code.matchAll(re)) {
      if (m[1] !== undefined) push('tk-com', m[1]);
      else if (m[2] !== undefined) push('tk-str', m[2]);
      else if (m[3] !== undefined) push('tk-num', m[3]);
      else if (m[4] !== undefined) {
        const w = m[4];
        let i = m.index + w.length;
        while (code[i] === ' ') i++;
        if (KW[lang].has(w)) push('tk-kw', w);
        else if (TYPES.has(w)) push('tk-ty', w);
        else if (code[i] === '(') push('tk-fn', w);
        else plain += w;
      } else plain += m[5];
    }
    flush();
    return out;
  }

  /* ---------- Icons ---------- */
  const Ico = ({ children, size = 16, fill = 'none' }) => html`
    <svg width=${size} height=${size} viewBox="0 0 20 20" fill=${fill} stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${children}</svg>`;
  const PlayI = () => html`<${Ico} fill="currentColor"><path d="M6.5 4.5v11l9-5.5z"/><//>`;
  const UploadI = () => html`<${Ico}><path d="M10 13V4M6.5 7.5L10 4l3.5 3.5M4 13.5v2h12v-2"/><//>`;
  const SendI = () => html`<${Ico}><path d="M17 3L9 11M17 3l-5 14-3-6-6-3z"/><//>`;
  const ClockI = () => html`<${Ico}><circle cx="10" cy="10" r="7.2"/><path d="M10 5.8V10l2.8 1.7"/><//>`;
  const BulbI = () => html`<${Ico}><path d="M7.5 15.5h5M8.2 17.5h3.6M10 2.5a5 5 0 0 0-3 9c.6.5 1 1.2 1 2h4c0-.8.4-1.5 1-2a5 5 0 0 0-3-9z"/><//>`;
  const ChevI = () => html`<${Ico} size=${14}><path d="M5 8l5 5 5-5"/><//>`;
  const ResetI = () => html`<${Ico}><path d="M4 10a6 6 0 1 1 1.8 4.3M4 5.5V10h4.5"/><//>`;
  const CheckI = () => html`<${Ico} size=${15}><path d="M4.5 10.5l3.5 3.5 7.5-8"/><//>`;
  const CrossI = () => html`<${Ico} size=${15}><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/><//>`;
  const TermI = () => html`<${Ico}><path d="M3.5 5l5 5-5 5M10.5 15h6"/><//>`;
  const Spinner = () => html`<span className="inline-block w-3.5 h-3.5 rounded-full border-2 border-current border-t-transparent animate-spin" aria-hidden="true"></span>`;

  const Logo = () => html`
    <div className="flex items-center gap-2.5">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="var(--accent)"/>
        <path d="M10.5 9L6 14l4.5 5" stroke="#1a1204" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M17.5 9L22 14l-4.5 5" stroke="#1a1204" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M15.2 8.5l-2.4 11" stroke="#1a1204" strokeWidth="2.2" strokeLinecap="round"/>
      </svg>
      <span className="font-display text-[18px] font-semibold tracking-tight">AlgoPrep<span className="text-accent">AI</span></span>
    </div>`;

  /* ---------- Header + pacing ---------- */
  function Header({ remaining, onEnd }) {
    const low = remaining <= 300;
    const critical = remaining <= 60;
    const tone = critical ? 'text-bad border-bad' : low ? 'text-accent border-accent' : 'text-fg border-line2';
    return html`
      <header className="flex items-center justify-between gap-3 h-14 px-4 border-b border-line bg-panel flex-none">
        <${Logo} />
        <div className="hidden md:flex items-center gap-2 text-[12.5px] text-muted">
          <span className="live-dot w-2 h-2 rounded-full bg-ok"></span>
          <span>Round 1 · Data Structures · Live</span>
        </div>
        <div className="flex items-center gap-3">
          <div role="timer" aria-label="Time remaining" className=${'flex items-center gap-2 h-9 px-3 rounded-md border font-mono tabular-nums text-[15px] font-medium ' + tone}>
            <${ClockI} />
            <span>${fmt(remaining)}</span>
          </div>
          <button onClick=${onEnd} className="h-9 px-3.5 rounded-md border border-line2 text-[13px] font-medium text-bad hover:bg-badsoft hover:border-bad transition-colors">End Interview</button>
        </div>
      </header>`;
  }

  function Pacing({ elapsed }) {
    let start = 0;
    return html`
      <div className="flex items-center gap-4 px-4 py-2 border-b border-line bg-bg flex-none">
        <span className="hidden sm:block text-[11px] uppercase tracking-[0.08em] text-dim flex-none">Pacing</span>
        <div className="grid grid-cols-4 gap-2 flex-1 min-w-0">
          ${PHASES.map((p) => {
            const s = start; start += p.min * 60;
            const fill = Math.max(0, Math.min(1, (elapsed - s) / (p.min * 60)));
            const current = (fill > 0 && fill < 1) || (elapsed === 0 && s === 0);
            return html`
              <div key=${p.name} className="min-w-0">
                <div className=${'flex items-baseline justify-between text-[11.5px] mb-1 ' + (current ? 'text-fg font-medium' : 'text-muted')}>
                  <span className="truncate">${p.name}</span><span className="text-dim font-mono ml-1">${p.min}m</span>
                </div>
                <div className="h-[3px] rounded-full bg-line overflow-hidden"><div className="h-full bg-accent" style=${{ width: (fill * 100) + '%' }}></div></div>
              </div>`;
          })}
        </div>
      </div>`;
  }

  /* ---------- Left panel ---------- */
  function Problem({ collapsed, onToggle }) {
    return html`
      <section className="flex-none flex flex-col min-h-0 border-b border-line" style=${{ maxHeight: collapsed ? 'none' : '52%' }}>
        <div className="flex items-center justify-between h-10 px-4 flex-none border-b border-line bg-panel2">
          <div className="flex items-center gap-2 text-[12.5px] font-medium">
            <span className="text-muted">Problem</span>
          </div>
          <button onClick=${onToggle} aria-expanded=${!collapsed} aria-label=${collapsed ? 'Expand problem' : 'Collapse problem'} className="flex items-center gap-1 text-[12px] text-muted hover:text-fg">
            ${collapsed ? 'Show' : 'Hide'}
            <span className=${'transition-transform ' + (collapsed ? '' : 'rotate-180')}><${ChevI} /></span>
          </button>
        </div>
        ${!collapsed && html`
        <div className="overflow-y-auto px-4 py-4 text-[13.5px]">
          <div className="flex items-center flex-wrap gap-2.5 mb-3">
            <h1 className="font-display text-[20px] font-semibold tracking-tight">1. Two Sum</h1>
            <span className="px-2 py-0.5 rounded text-[11.5px] font-medium bg-oksoft text-ok">Easy</span>
            <span className="px-2 py-0.5 rounded text-[11.5px] text-muted border border-line2">Array</span>
            <span className="px-2 py-0.5 rounded text-[11.5px] text-muted border border-line2">Hash Table</span>
          </div>
          <p className="prose-p mb-3">Given an array of integers <code className="font-mono text-[12.5px] text-tk-fn" style=${{ color: 'var(--tk-fn)' }}>nums</code> and an integer <code className="font-mono text-[12.5px]" style=${{ color: 'var(--tk-fn)' }}>target</code>, return the indices of the two numbers that add up to <code className="font-mono text-[12.5px]" style=${{ color: 'var(--tk-fn)' }}>target</code>.</p>
          <p className="prose-p mb-4">Each input has exactly one solution, and the same element cannot be used twice. The answer can be returned in any order.</p>

          <div className="space-y-2.5 mb-4">
            <div className="ex-box font-mono text-[12.5px] leading-6">
              <div className="text-muted text-[11px] uppercase tracking-[0.08em] font-sans mb-0.5">Example 1</div>
              <div><span className="text-muted">Input:</span> nums = [2,7,11,15], target = 9</div>
              <div><span className="text-muted">Output:</span> [0,1]</div>
              <div className="text-muted font-sans text-[12.5px]">nums[0] + nums[1] = 2 + 7 = 9</div>
            </div>
            <div className="ex-box font-mono text-[12.5px] leading-6">
              <div className="text-muted text-[11px] uppercase tracking-[0.08em] font-sans mb-0.5">Example 2</div>
              <div><span className="text-muted">Input:</span> nums = [3,2,4], target = 6</div>
              <div><span className="text-muted">Output:</span> [1,2]</div>
            </div>
          </div>

          <div className="text-[11px] uppercase tracking-[0.08em] text-dim mb-1.5">Constraints</div>
          <ul className="font-mono text-[12.5px] text-[#c9cfdb] space-y-1 list-disc pl-5 marker:text-dim">
            <li>2 ≤ nums.length ≤ 10⁴</li>
            <li>−10⁹ ≤ nums[i], target ≤ 10⁹</li>
            <li>Exactly one valid answer exists</li>
          </ul>
        </div>`}
      </section>`;
  }

  function Chat({ messages, typing, hintsUsed, onSend, onHint, onQuick, disabled }) {
    const [draft, setDraft] = useState('');
    const box = useRef(null);
    useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [messages, typing]);
    const submit = () => { const t = draft.trim(); if (!t) return; onSend(t); setDraft(''); };
    const chip = 'h-7 px-2.5 rounded-full border border-line2 text-[12px] text-muted hover:text-fg hover:border-muted transition-colors whitespace-nowrap disabled:opacity-40';
    return html`
      <section className="flex-1 min-h-0 flex flex-col">
        <div className="flex items-center justify-between h-10 px-4 flex-none border-b border-line bg-panel2">
          <div className="flex items-center gap-2 text-[12.5px] font-medium">
            <span className="grid place-items-center w-5 h-5 rounded-full bg-accentsoft text-accent font-display text-[11px] font-semibold">A</span>
            <span>Aria</span><span className="text-muted font-normal">AI interviewer</span>
          </div>
          <div className="flex items-center gap-1.5 text-[12px] text-muted">
            <span className="text-accent"><${BulbI} size=${14} /></span>
            <span>Hints <span className="font-mono text-fg">${hintsUsed}/${HINTS.length}</span></span>
          </div>
        </div>

        <div ref=${box} className="flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-3.5" aria-live="polite">
          ${messages.map((m) => m.role === 'me'
            ? html`<div key=${m.id} className="flex justify-end"><div className="max-w-[85%] rounded-lg rounded-br-sm px-3.5 py-2.5 text-[13.5px] leading-relaxed bg-line text-fg">${m.text}</div></div>`
            : html`
              <div key=${m.id} className="flex gap-2.5">
                <span className="grid place-items-center w-6 h-6 mt-0.5 rounded-full bg-accentsoft text-accent font-display text-[12px] font-semibold flex-none">A</span>
                <div className="max-w-[88%] min-w-0">
                  ${m.role === 'hint' && html`<div className="inline-flex items-center gap-1.5 mb-1 text-[11px] font-medium uppercase tracking-[0.08em] text-accent"><${BulbI} size=${12} /> Hint ${m.hintNo} of ${HINTS.length}</div>`}
                  <div className=${'rounded-lg rounded-tl-sm px-3.5 py-2.5 text-[13.5px] leading-relaxed bg-panel2 border ' + (m.role === 'hint' ? 'border-accent' : 'border-line')} style=${m.role === 'hint' ? { borderColor: 'rgba(242,169,59,0.45)' } : null}>${m.text}</div>
                </div>
              </div>`)}
          ${typing && html`
            <div className="flex gap-2.5 items-center" aria-label="Aria is typing">
              <span className="grid place-items-center w-6 h-6 rounded-full bg-accentsoft text-accent font-display text-[12px] font-semibold flex-none">A</span>
              <div className="flex gap-1 px-3.5 py-3 rounded-lg bg-panel2 border border-line"><span className="dot w-1.5 h-1.5 rounded-full bg-muted"></span><span className="dot w-1.5 h-1.5 rounded-full bg-muted"></span><span className="dot w-1.5 h-1.5 rounded-full bg-muted"></span></div>
            </div>`}
        </div>

        <div className="flex-none border-t border-line p-3 space-y-2.5">
          <div className="flex gap-2 overflow-x-auto pb-0.5">
            <button className=${chip} disabled=${disabled} onClick=${onHint}>Give me a hint</button>
            <button className=${chip} disabled=${disabled} onClick=${() => onQuick('clarify')}>Clarify the constraints</button>
            <button className=${chip} disabled=${disabled} onClick=${() => onQuick('ready')}>I am ready to code</button>
          </div>
          <div className="flex items-center gap-2">
            <input id="chat-input" value=${draft} disabled=${disabled} onChange=${(e) => setDraft(e.target.value)}
              onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }}
              placeholder="Reply to your interviewer"
              aria-label="Reply to your interviewer"
              className="flex-1 min-w-0 h-10 px-3 rounded-md bg-bg border border-line2 text-[13.5px] placeholder:text-dim focus:border-accent focus:outline-none" />
            <button onClick=${submit} disabled=${!draft.trim() || disabled} aria-label="Send reply"
              className="grid place-items-center w-10 h-10 rounded-md bg-accent text-accentink disabled:bg-line disabled:text-dim transition-colors"><${SendI} /></button>
          </div>
        </div>
      </section>`;
  }

  /* ---------- Right panel ---------- */
  function Editor({ lang, code, onChange, onRun }) {
    const ta = useRef(null), pre = useRef(null), gut = useRef(null);
    const [pos, setPos] = useState({ line: 1, col: 1 });
    const lines = code.split('\n').length;

    const updatePos = () => {
      const el = ta.current; if (!el) return;
      const upTo = el.value.slice(0, el.selectionStart);
      setPos({ line: upTo.split('\n').length, col: upTo.length - upTo.lastIndexOf('\n') });
    };
    const sync = () => {
      const el = ta.current; if (!el) return;
      pre.current.scrollTop = el.scrollTop; pre.current.scrollLeft = el.scrollLeft; gut.current.scrollTop = el.scrollTop;
    };
    const onKeyDown = (e) => {
      const el = e.target;
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun(); return; }
      if (e.key === 'Tab') {
        e.preventDefault();
        el.setRangeText('    ', el.selectionStart, el.selectionEnd, 'end');
        onChange(el.value); updatePos();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const before = el.value.slice(0, el.selectionStart);
        const cur = before.slice(before.lastIndexOf('\n') + 1);
        const indent = (cur.match(/^\s*/) || [''])[0] + (/[:{]\s*$/.test(cur) ? '    ' : '');
        el.setRangeText('\n' + indent, el.selectionStart, el.selectionEnd, 'end');
        onChange(el.value); updatePos();
      }
    };

    return html`
      <div className="flex-1 min-h-0 flex flex-col">
        <div className="flex-1 min-h-0 flex bg-bg">
          <div ref=${gut} className="flex-none w-12 overflow-hidden select-none text-right font-mono text-[12.5px] text-dim border-r border-line" style=${{ padding: '12px 0 56px' }} aria-hidden="true">
            ${Array.from({ length: lines }, (_, i) => html`<div key=${i} className=${'gutter-line pr-3 ' + (i + 1 === pos.line ? 'text-fg' : '')}>${i + 1}</div>`)}
          </div>
          <div className="relative flex-1 min-w-0">
            <pre ref=${pre} className="code-layer absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">${highlight(code, lang)}${'\n'}</pre>
            <textarea ref=${ta} id="code-editor" className="code-layer code-input absolute inset-0 w-full h-full" value=${code} wrap="off" spellCheck=${false} autoCapitalize="off" autoCorrect="off" aria-label="Code editor"
              onChange=${(e) => onChange(e.target.value)} onScroll=${sync} onKeyDown=${onKeyDown} onKeyUp=${updatePos} onClick=${updatePos} onSelect=${updatePos}></textarea>
          </div>
        </div>
        <div className="flex items-center justify-between h-7 px-3 flex-none border-t border-line bg-panel2 text-[11.5px] text-muted font-mono">
          <span>Ln ${pos.line}, Col ${pos.col}</span>
          <span className="flex items-center gap-3"><span>Spaces: 4</span><span>UTF-8</span><span className="flex items-center gap-1.5 font-sans"><span className="w-1.5 h-1.5 rounded-full bg-ok"></span>Auto-saved</span></span>
        </div>
      </div>`;
  }

  function CaseDetail({ idx, result, tab }) {
    const c = CASES[idx];
    const box = 'ex-box font-mono text-[12.5px]';
    const lbl = 'text-[11px] uppercase tracking-[0.08em] text-dim font-sans mb-1';
    const r = result && result.cases && result.cases[idx];
    return html`
      <div className="space-y-2.5 mt-3">
        <div><div className=${lbl}>nums =</div><div className=${box}>${c.nums}</div></div>
        <div><div className=${lbl}>target =</div><div className=${box}>${c.target}</div></div>
        ${tab === 'result' && r && html`
          <div><div className=${lbl}>Output</div><div className=${box} style=${{ color: r.pass ? 'var(--ok)' : 'var(--bad)' }}>${r.output}</div></div>
          <div><div className=${lbl}>Expected</div><div className=${box}>${c.expected}</div></div>`}
      </div>`;
  }

  function Console({ open, tab, setTab, activeCase, setActiveCase, result }) {
    const tabBtn = (id, label) => html`
      <button onClick=${() => setTab(id)} className=${'h-9 px-3 text-[12.5px] font-medium border-b-2 transition-colors ' + (tab === id ? 'border-accent text-fg' : 'border-transparent text-muted hover:text-fg')}>${label}</button>`;
    if (!open) return null;
    const running = result && result.state === 'running';
    const done = result && result.state === 'done';
    const ok = done && result.verdict === 'Accepted' || (done && result.verdict === 'Passed');
    return html`
      <div className="flex-none h-[212px] border-t border-line bg-panel flex flex-col">
        <div className="flex items-center gap-1 px-2 border-b border-line flex-none">${tabBtn('testcase', 'Testcase')}${tabBtn('result', 'Result')}</div>
        <div className="flex-1 min-h-0 overflow-y-auto p-3">
          ${tab === 'result' && !result && html`<div className="h-full grid place-items-center text-[13px] text-muted text-center">Run your code to see results for the sample cases.</div>`}
          ${tab === 'result' && running && html`<div className="h-full flex items-center justify-center gap-2.5 text-[13px] text-muted"><${Spinner} /> ${result.mode === 'submit' ? 'Judging against all test cases' : 'Running sample cases'}</div>`}
          ${(tab === 'testcase' || done) && html`
            <div>
              ${tab === 'result' && done && html`
                <div className="flex items-baseline gap-3 flex-wrap mb-2.5">
                  <span className=${'font-display text-[18px] font-semibold ' + (ok ? 'text-ok' : 'text-bad')}>${result.verdict}</span>
                  <span className="text-[12.5px] text-muted">${result.summary}</span>
                </div>`}
              <div className="flex gap-2 flex-wrap">
                ${CASES.map((_, i) => {
                  const r = tab === 'result' && result && result.cases && result.cases[i];
                  return html`
                    <button key=${i} onClick=${() => setActiveCase(i)} className=${'flex items-center gap-1.5 h-7 px-2.5 rounded-md text-[12px] border transition-colors ' + (activeCase === i ? 'bg-panel2 border-line2 text-fg' : 'border-transparent text-muted hover:text-fg')}>
                      ${r && html`<span className="w-1.5 h-1.5 rounded-full" style=${{ background: r.pass ? 'var(--ok)' : 'var(--bad)' }}></span>`}
                      Case ${i + 1}
                    </button>`;
                })}
              </div>
              <${CaseDetail} idx=${activeCase} result=${result} tab=${tab} />
            </div>`}
        </div>
      </div>`;
  }

  /* ---------- Modals ---------- */
  function Modal({ children, label }) {
    return html`
      <div className="fixed inset-0 z-50 grid place-items-center p-4" style=${{ background: 'rgba(8,10,14,0.82)' }} role="dialog" aria-modal="true" aria-label=${label}>
        <div className="w-full max-w-md rounded-lg border border-line2 bg-panel p-6 shadow-2xl">${children}</div>
      </div>`;
  }

  /* ---------- App ---------- */
  function App() {
    const [remaining, setRemaining] = useState(TOTAL);
    const [ended, setEnded] = useState(null); // null | 'user' | 'time'
    const [confirmEnd, setConfirmEnd] = useState(false);

    const [lang, setLang] = useState('python');
    const [codes, setCodes] = useState(STARTER);
    const [probCollapsed, setProbCollapsed] = useState(false);

    const [consoleOpen, setConsoleOpen] = useState(true);
    const [tab, setTab] = useState('testcase');
    const [activeCase, setActiveCase] = useState(0);
    const [result, setResult] = useState(null);
    const [stats, setStats] = useState({ runs: 0, submits: 0, verdict: '–' });

    const [messages, setMessages] = useState(SEED);
    const [typing, setTyping] = useState(false);
    const [hintsUsed, setHintsUsed] = useState(0);
    const nid = useRef(10), fu = useRef(0), timers = useRef([]);
    useEffect(() => () => timers.current.forEach(clearTimeout), []);

    useEffect(() => {
      if (ended) return;
      const t = setInterval(() => setRemaining((r) => Math.max(0, r - 1)), 1000);
      return () => clearInterval(t);
    }, [ended]);
    useEffect(() => { if (remaining === 0 && !ended) { setEnded('time'); setConfirmEnd(false); } }, [remaining, ended]);
    useEffect(() => {
      if (!confirmEnd) return;
      const h = (e) => { if (e.key === 'Escape') setConfirmEnd(false); };
      window.addEventListener('keydown', h);
      return () => window.removeEventListener('keydown', h);
    }, [confirmEnd]);

    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.current.push(t); };
    const aiSay = (text, role = 'ai', delay = 1100, extra = {}) => {
      setTyping(true);
      later(() => { setTyping(false); setMessages((m) => [...m, { id: nid.current++, role, text, ...extra }]); }, delay);
    };
    const sendMsg = (text, reply) => {
      setMessages((m) => [...m, { id: nid.current++, role: 'me', text }]);
      aiSay(reply || FOLLOWUPS[fu.current++ % FOLLOWUPS.length]);
    };
    const useHint = () => {
      if (hintsUsed >= HINTS.length) {
        setMessages((m) => [...m, { id: nid.current++, role: 'me', text: 'Can I get another hint?' }]);
        aiSay('That was the last hint. Tell me where you are stuck and we will work through it together.', 'ai', 900);
        return;
      }
      const n = hintsUsed + 1;
      setHintsUsed(n);
      setMessages((m) => [...m, { id: nid.current++, role: 'me', text: 'Can I get a hint?' }]);
      aiSay(HINTS[n - 1], 'hint', 1000, { hintNo: n });
    };
    const quick = (kind) => {
      if (kind === 'clarify') sendMsg('Can I assume the values are integers and exactly one valid pair exists?', 'Yes to both. Each input has exactly one solution, and you cannot reuse the same element.');
      else sendMsg('I am ready to start coding.', 'Go ahead. I will watch the editor, so say your thinking out loud as you type.');
    };

    const busy = result && result.state === 'running';
    const runTests = (mode) => {
      if (busy || ended) return;
      const current = codes[lang];
      const changed = current.trim() !== STARTER[lang].trim();
      setConsoleOpen(true); setTab('result'); setActiveCase(0);
      setResult({ state: 'running', mode });
      later(() => {
        let r;
        if (changed) {
          const cases = CASES.map((c) => ({ pass: true, output: c.expected }));
          r = mode === 'submit'
            ? { state: 'done', mode, verdict: 'Accepted', summary: '57 / 57 passed · Runtime 48 ms · Beats 91% · Memory 17.4 MB', cases }
            : { state: 'done', mode, verdict: 'Passed', summary: '3 / 3 sample cases passed · Runtime 41 ms', cases };
        } else {
          const cases = CASES.map(() => ({ pass: false, output: lang === 'python' ? 'None' : '[]' }));
          r = { state: 'done', mode, verdict: 'Wrong Answer', summary: mode === 'submit' ? '0 / 57 passed · Failed on case 1' : '0 / 3 sample cases passed', cases };
        }
        setResult(r);
        setStats((s) => ({ runs: s.runs + (mode === 'run' ? 1 : 0), submits: s.submits + (mode === 'submit' ? 1 : 0), verdict: r.verdict }));
        if (mode === 'submit' && r.verdict === 'Accepted') aiSay('Your solution is accepted. Before we wrap up, state its time and space complexity and explain why.', 'ai', 900);
      }, mode === 'submit' ? 1500 : 900);
    };

    const reset = () => {
      timers.current.forEach(clearTimeout); timers.current = [];
      setRemaining(TOTAL); setEnded(null); setConfirmEnd(false);
      setLang('python'); setCodes(STARTER); setProbCollapsed(false);
      setConsoleOpen(true); setTab('testcase'); setActiveCase(0); setResult(null);
      setStats({ runs: 0, submits: 0, verdict: '–' });
      setMessages(SEED); setTyping(false); setHintsUsed(0);
    };

    const elapsed = TOTAL - remaining;
    const ctl = 'h-9 px-4 rounded-md text-[13px] font-medium flex items-center gap-2 transition-colors disabled:opacity-60';

    return html`
      <div className="min-h-full lg:h-full flex flex-col bg-bg">
        <${Header} remaining=${remaining} onEnd=${() => setConfirmEnd(true)} />
        <${Pacing} elapsed=${elapsed} />

        <main className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-2 gap-3 p-4">
          <div className="h-[760px] lg:h-auto min-h-0 min-w-0 flex flex-col rounded-md border border-line bg-panel overflow-hidden">
            <${Problem} collapsed=${probCollapsed} onToggle=${() => setProbCollapsed((c) => !c)} />
            <${Chat} messages=${messages} typing=${typing} hintsUsed=${hintsUsed} onSend=${(t) => sendMsg(t)} onHint=${useHint} onQuick=${quick} disabled=${!!ended} />
          </div>

          <div className="h-[700px] lg:h-auto min-h-0 min-w-0 flex flex-col rounded-md border border-line bg-panel overflow-hidden">
            <div className="flex items-center justify-between gap-2 h-10 pl-1 pr-3 flex-none border-b border-line bg-panel2">
              <div className="flex items-center h-full">
                <div className="flex items-center gap-2 h-full px-3 text-[12.5px] font-mono border-b-2 border-accent text-fg">
                  <span className="w-1.5 h-1.5 rounded-full bg-accent"></span>${FILE[lang]}
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick=${() => setCodes((c) => ({ ...c, [lang]: STARTER[lang] }))} aria-label="Reset code" title="Reset to starter code" className="grid place-items-center w-8 h-8 rounded-md text-muted hover:text-fg hover:bg-line"><${ResetI} /></button>
                <div className="relative">
                  <label htmlFor="lang" className="sr-only">Language</label>
                  <select id="lang" value=${lang} onChange=${(e) => setLang(e.target.value)} className="appearance-none h-8 pl-3 pr-8 rounded-md bg-bg border border-line2 text-[12.5px] font-medium text-fg cursor-pointer hover:border-muted focus:border-accent focus:outline-none">
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                  </select>
                  <span className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-muted"><${ChevI} /></span>
                </div>
              </div>
            </div>

            <${Editor} lang=${lang} code=${codes[lang]} onChange=${(v) => setCodes((c) => ({ ...c, [lang]: v }))} onRun=${() => runTests('run')} />
            <${Console} open=${consoleOpen} tab=${tab} setTab=${setTab} activeCase=${activeCase} setActiveCase=${setActiveCase} result=${result} />

            <div className="flex items-center justify-between gap-3 h-14 px-3 flex-none border-t border-line bg-panel2">
              <button onClick=${() => setConsoleOpen((o) => !o)} aria-expanded=${consoleOpen} className="flex items-center gap-2 h-9 px-2.5 rounded-md text-[13px] text-muted hover:text-fg hover:bg-line">
                <${TermI} /> Console
                <span className=${'transition-transform ' + (consoleOpen ? '' : 'rotate-180')}><${ChevI} /></span>
              </button>
              <div className="flex items-center gap-2">
                <button onClick=${() => runTests('run')} disabled=${busy || !!ended} className=${ctl + ' bg-line text-fg hover:bg-line2'}>
                  ${busy && result.mode === 'run' ? html`<${Spinner} />` : html`<${PlayI} />`} Run Code
                  <span className="hidden xl:inline font-mono text-[11px] text-muted">Ctrl ↵</span>
                </button>
                <button onClick=${() => runTests('submit')} disabled=${busy || !!ended} className=${ctl + ' bg-accent text-accentink hover:brightness-110'}>
                  ${busy && result.mode === 'submit' ? html`<${Spinner} />` : html`<${UploadI} />`} Submit
                </button>
              </div>
            </div>
          </div>
        </main>

        ${confirmEnd && !ended && html`
          <${Modal} label="End interview">
            <h2 className="font-display text-[20px] font-semibold tracking-tight mb-2">End this interview?</h2>
            <p className="text-[13.5px] text-muted leading-relaxed mb-5">You have ${fmt(remaining)} left. Ending now closes the session and shows your summary. You cannot resume it.</p>
            <div className="flex justify-end gap-2">
              <button onClick=${() => setConfirmEnd(false)} className="h-9 px-4 rounded-md bg-line text-[13px] font-medium hover:bg-line2">Keep going</button>
              <button onClick=${() => { setEnded('user'); setConfirmEnd(false); }} className="h-9 px-4 rounded-md text-[13px] font-medium" style=${{ background: 'var(--bad)', color: '#1d0808' }}>End Interview</button>
            </div>
          <//>`}

        ${ended && html`
          <${Modal} label="Interview summary">
            <h2 className="font-display text-[22px] font-semibold tracking-tight mb-1">${ended === 'time' ? 'Time is up' : 'Interview ended'}</h2>
            <p className="text-[13.5px] text-muted mb-5">Here is how this session went.</p>
            <div className="grid grid-cols-2 gap-2.5 mb-6">
              ${[['Time used', fmt(elapsed)], ['Hints used', hintsUsed + ' / ' + HINTS.length], ['Test runs', String(stats.runs)], ['Last verdict', stats.verdict]].map(([k, v]) => html`
                <div key=${k} className="ex-box"><div className="text-[11px] uppercase tracking-[0.08em] text-dim mb-1">${k}</div><div className="font-mono text-[15px]">${v}</div></div>`)}
            </div>
            <button onClick=${reset} className="w-full h-10 rounded-md bg-accent text-accentink text-[13.5px] font-semibold hover:brightness-110">Start a new session</button>
          <//>`}
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

</body></html>
